      for(let i=0;i<3;i++){
        drawFigure(ctx,{x:100+i*40,y:h*0.32,scale:0.5,sex:"male",skin:"#c98f5c",outfit:S.player.outfit,hair:"#2a1a10",weapon:"sword",armored:true});
        drawFigure(ctx,{x:w-100-i*40,y:h*0.30,scale:0.5,sex:"male",skin:"#8a6a4a",outfit:"#4a3a24",hair:"#1a1208",weapon:"club",beard:true});
      }
    }
  }
  // no one fights in their court finery — chainmail and a helm, banded in their own colours, replace it in battle
  drawFigure(ctx,{x:w*0.28,y:h*0.68,scale:1.5,sex:S.player.sex,skin:S.player.skin,outfit:S.player.outfit,hair:S.player.hair,noble:true,armored:true,
    weapon:cs.playerPose==="block"?"shield":c.weapon, pose:cs.playerPose, facing:1});
  drawFigure(ctx,{x:w*0.72,y:h*0.68,scale:1.5,sex:"male",skin: c.royal? "#c98f5c":"#8a6a4a",outfit: c.royal?"#2a3a6a":(c.kind==="tournament"?"#5a5a5a":"#4a3a24"),
    hair:"#1a1208", weapon:c.enemyWeapon, pose:cs.enemyPose, facing:-1, hit:cs.enemyPose==="stagger", beard:c.kind==="brigands", armored:c.kind!=="brigands"});
  if(cs.phase==="windup"){
    ctx.fillStyle="rgba(255,80,60,0.85)";
    ctx.beginPath(); ctx.arc(w*0.72,h*0.42,10,0,Math.PI*2); ctx.fill();
  }
  if(cs.phase==="opening"){
    ctx.fillStyle="rgba(90,220,120,0.85)";
    ctx.beginPath(); ctx.arc(w*0.72,h*0.42,10,0,Math.PI*2); ctx.fill();
  }
}
function endCombat(victory, fled){
  const cs=combatState; cs.running=false;
  if(combatKeyHandler){ document.removeEventListener("keydown", combatKeyHandler); combatKeyHandler=null; }
  Audio1.setMode("ambient");
  const killed = cs.cfg.background ? cs.bgKills : cs.enemiesDefeated;
  if(fled){
    toast("You Withdraw","You retreat from the field, weapon undrawn further.",3200);
  } else if(victory){
    cs.cfg.onWin(killed);
  } else {
    cs.cfg.onLose(killed);
  }
  save();
  setTimeout(()=>{
    if(S.gameEnded && S.warWon){ screenEnding(); }
    else { screenKeep(); }
  }, 350);
}

/* ============================= SEASON ADVANCE ============================= */
function endSeason(msg){
  save();
  S.seasonsPlayed++;
  // a fresh season, a fresh allowance of courtly attention
  S.romanceCap=2; S.romanceUsed=0; S.romancePairsUsed=[];
  // seasonal harvest/economy tick
  const harvestGold = Math.round((S.productivity/100) * (20+S.serfs*0.6));
  S.gold += harvestGold;
  if(S.morale<25 || S.productivity<20){
    const lost=randi(0,4);
    S.serfs=Math.max(0,S.serfs-lost);
  } else if(S.morale>65 && S.productivity>55){
    S.serfs += randi(0,3);
  }
  // crop status now tracks how well the barony is actually run, not pure chance:
  // well-treated, productive serfs tend the fields better; neglected ones let them go to seed.
  const cropDrift = Math.round((S.productivity-50)/8) + Math.round((S.morale-50)/12) + randi(-3,3);
  S.cropStatus = clamp(S.cropStatus + cropDrift, 5, 100);
  S.seasonIndex++;
  if(S.seasonIndex%4===0) S.year++;
  // random event — but King John's ill will can only stay quiet so long: force a
  // grievance at least every third season so the mounting-tyranny arc keeps pace.
  S.seasonsSinceKingTrouble = (S.seasonsSinceKingTrouble||0)+1;
  const kingEvents = RANDOM_EVENTS.filter(e=>e.kingTrouble);
  let ev;
  if(S.seasonsSinceKingTrouble>=3){
    ev = choice(kingEvents);
  } else {
    const total = RANDOM_EVENTS.reduce((a,e)=>a+e.weight,0);
    let r=rand(0,total); ev=RANDOM_EVENTS[RANDOM_EVENTS.length-1];
    for(const e of RANDOM_EVENTS){ if(r<e.weight){ ev=e; break;} r-=e.weight; }
  }
  if(ev.kingTrouble) S.seasonsSinceKingTrouble=0;
  ev.fx(S);
  save();
  updateSeasonLabel();
  screenKeep(`${msg} The season turns to ${seasonName()}. The harvest brought ${harvestGold}g.`);
  setTimeout(()=>{
    modal(ev.name, `<p>${ev.text}</p>`, [{label:"Continue", cls:"gold"}]);
  }, 200);
}

/* ============================= ENDING ============================= */
function screenEnding(){
  stopActiveAnim();
  Audio1.setMode("victory"); Audio1.start();
  stage.innerHTML = `<div class="viewport" style="aspect-ratio:16/8; margin-bottom:16px;"><canvas id="endCanvas" width="900" height="440"></canvas></div>
  <div class="panel">
    <h2 class="section" style="color:#7c1f2b;"><span class="drop">R</span>unnymede, June 1215</h2>
    <p>The King's resistance is broken. On the meadow at Runnymede, beneath a sky heavy with the weight of history,
    King John sets his seal to the Great Charter &mdash; <em>Magna Carta</em>. For the first time, a King of England
    formally concedes that his power has limits: that free men cannot be imprisoned or dispossessed except by lawful
    judgement, that the Church shall be free, that even the Crown is answerable to the law of the land.</p>
    <p>The Charter that emerges from this rebellion will be revised and reissued for centuries, and its principles
    &mdash; the rule of law, protection from arbitrary power, the seed of due process &mdash; will echo far beyond
    thirteenth-century England, into constitutions and legal systems around the world.</p>
    <h3 style="font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.06em; color:#7c1f2b;">Your Reign, in Sum</h3>
    <div class="npc-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));">
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Seasons Ruled</div><div>${S.seasonsPlayed}</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Gold in Treasury</div><div>${fmt(S.gold)}g</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Knights Employed</div><div>${S.knights}</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Serfs</div><div>${fmt(S.serfs)}</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Combat Ability</div><div>${fmt(S.combat)}</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Baron Relations</div><div>${fmt(S.baronRelation)}%</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Married</div><div>${S.married? NOBLES.find(n=>n.id===S.spouseId).name : "No"}</div></div>
      <div class="npc-card" style="cursor:default;"><div class="npc-name">Children</div><div>${S.children.length}</div></div>
    </div>
    <div class="btnrow" style="margin-top:14px;">
      <button class="btn gold" id="btnNewReign">Begin a New Reign</button>
    </div>
  </div>`;
  const ctx=$("#endCanvas").getContext("2d");
  const w=900, h=440;
  // sky, hazy toward the horizon
  const skyG=ctx.createLinearGradient(0,0,0,150);
  skyG.addColorStop(0,"#bcdcec"); skyG.addColorStop(1,"#dbe8c4");
  ctx.fillStyle=skyG; ctx.fillRect(0,0,w,150);
  // trees along the far bank, behind everything
  for(let i=0;i<14;i++){
    const tx=i*(w/13), ty=118+((i*37)%14);
    const c = i%2===0 ? "#4a6a42" : "#3d5c38";
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(tx,ty,20+((i*17)%10),0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(tx+14,ty+6,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#2a1c10"; ctx.fillRect(tx-2,ty+8,4,16);
  }
  // the river — a shining band of water between the trees and the meadow
  const waterG=ctx.createLinearGradient(0,140,0,200);
  waterG.addColorStop(0,"#8fbcd9"); waterG.addColorStop(1,"#4a7ab0");
  ctx.fillStyle=waterG; ctx.fillRect(0,140,w,60);
  ctx.fillStyle="rgba(255,255,255,0.55)";
  for(let i=0;i<24;i++){
    const sx=(i*61)%w, sy=148+((i*13)%44);
    ctx.beginPath(); ctx.ellipse(sx,sy,10+((i*7)%8),1.6,0,0,Math.PI*2); ctx.fill();
  }
  // the water-meadow itself, where everyone stands
  const grassG=ctx.createLinearGradient(0,196,0,h);
  grassG.addColorStop(0,"#8fae5a"); grassG.addColorStop(1,"#5c7f3a");
  ctx.fillStyle=grassG; ctx.fillRect(0,196,w,h-196);
  ctx.strokeStyle="rgba(0,0,0,0.06)";
  for(let i=0;i<40;i++){ const gx=(i*97)%w, gy=210+((i*53)%(h-220)); ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-2,gy-7); ctx.stroke(); }

  // the barons, come to witness, with the player leading them at the front of the assembly
  for(let i=0;i<5;i++){
    drawFigure(ctx,{x:200+i*58,y:330,scale:1.05,sex:i%2===0?"male":"female",skin:choice(["#e8c39a","#c98f5c"]),outfit:choice(["#7a3a2a","#3a5a8c","#5c3a8c","#3f4f37"]),hair:"#2a1a10",noble:true});
  }
  drawFigure(ctx,{x:495,y:330,scale:1.2,sex:S.player.sex,skin:S.player.skin,outfit:S.player.outfit,hair:S.player.hair,noble:true});

  // King John, seated in his chair at his table, sealing the charter — cross about it to the last.
  // Scaled close to the barons (a king, not a giant), so he reads as one more figure at Runnymede, not a monument.
  const Kx=660, Ky=330, Kscale=1.18;
  // the chair, drawn first so the King reads as sitting in it — a tall back peeking above his
  // shoulders, with posts reaching all the way down to the meadow
  ctx.fillStyle="#241811"; ctx.fillRect(Kx-33,302,8,112); ctx.fillRect(Kx+25,302,8,112);
  const chairGrad=ctx.createLinearGradient(0,264,0,388);
  chairGrad.addColorStop(0,"#3a2818"); chairGrad.addColorStop(1,"#241811");
  ctx.fillStyle=chairGrad; ctx.fillRect(Kx-25,264,50,124);
  ctx.strokeStyle="#1a120a"; ctx.lineWidth=2; ctx.strokeRect(Kx-25,264,50,124);
  ctx.fillStyle="#3a2818"; ctx.beginPath(); ctx.arc(Kx-25,264,5,0,Math.PI*2); ctx.arc(Kx+25,264,5,0,Math.PI*2); ctx.fill();

  drawFigure(ctx,{x:Kx,y:Ky,scale:Kscale,sex:"male",skin:"#e8c39a",outfit:"#5a1030",hair:"#9a3a1a",
    noble:true,crown:true,beard:true,mood:"angry",pose:"block",facing:-1});

  // the table: just a tabletop and slender open legs at the corners — a real writing table, not a
  // solid box — so the King's own legs stay visible beneath it, seated at his chair.
  const tableTop=Ky+22*Kscale, groundY=Ky+68*Kscale+8, tableLeft=Kx-62, tableRight=Kx+46;
  ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.beginPath(); ctx.ellipse((tableLeft+tableRight)/2,groundY+4,64,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#241811";
  ctx.fillRect(tableLeft+5,tableTop+8,7,groundY-(tableTop+8));
  ctx.fillRect(tableRight-12,tableTop+8,7,groundY-(tableTop+8));
  // the tabletop surface itself, a slim plank crossing in front of his lap
  ctx.fillStyle="#5a3f28"; ctx.fillRect(tableLeft-4,tableTop-7,tableRight-tableLeft+8,10);
  ctx.strokeStyle="#241811"; ctx.lineWidth=1.5; ctx.strokeRect(tableLeft-4,tableTop-7,tableRight-tableLeft+8,10);
  // the charter itself, laid open on the table, with the King's seal
  ctx.save();
  ctx.translate(tableLeft+18,tableTop-3); ctx.rotate(-0.08);
  ctx.fillStyle="#eee2c0"; ctx.fillRect(-24,-14,48,20);
  ctx.strokeStyle="#c9a227"; ctx.lineWidth=1; ctx.strokeRect(-24,-14,48,20);
  ctx.strokeStyle="rgba(90,70,30,0.4)"; ctx.lineWidth=0.6;
  for(let ln=-9;ln<10;ln+=4){ ctx.beginPath(); ctx.moveTo(-20,ln); ctx.lineTo(20,ln); ctx.stroke(); }
  ctx.fillStyle="#a4303f"; ctx.beginPath(); ctx.arc(16,10,5,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // a quill, laid across the charter as if just set down
  ctx.strokeStyle="#e8dcc0"; ctx.lineWidth=2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(tableLeft+8,tableTop-10); ctx.lineTo(tableLeft+34,tableTop-18); ctx.stroke();
  ctx.strokeStyle="#241a12"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(tableLeft+34,tableTop-18); ctx.lineTo(tableLeft+37,tableTop-19); ctx.stroke();

  ctx.font="bold 22px Georgia"; ctx.fillStyle="#241a12"; ctx.textAlign="center";
  ctx.fillText("Magna Carta, 1215", 450, 34);
  clearSave();
  $("#btnNewReign").onclick=()=>{ newGame(); screenCreation(); };
}
